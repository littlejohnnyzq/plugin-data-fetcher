# toptu.top Nginx 配置文件
# 用于 Node.js Express 服务器反向代理
# 首次配置：只配置 HTTP，certbot 会自动添加 HTTPS

# HTTP 服务器
server {
    listen 80;
    listen [::]:80;
    server_name toptu.top www.toptu.top;

    # Certbot 验证路径（必须在最前面，优先级最高）
    # 使用 root 指向 webroot 目录（与 certbot webroot 模式匹配）
    # 注意：这个 location 块必须独立，不能受其他 add_header 影响
    location ^~ /.well-known/acme-challenge/ {
        root /var/www/certbot;
        default_type text/plain;
        allow all;
        try_files $uri =404;
        # 确保不继承父级的 add_header
        add_header Content-Type text/plain;
        # 不记录访问日志（可选）
        access_log off;
    }

    # Node.js 反向代理（转发所有请求到 Express 服务器）
    location / {
        proxy_pass http://127.0.0.1:1086;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
        proxy_read_timeout 300s;
        proxy_connect_timeout 75s;
        
        # CORS 头（可选，如果 Node.js 已经处理了 CORS）
        add_header Access-Control-Allow-Origin * always;
        add_header Access-Control-Allow-Methods 'GET, POST, OPTIONS' always;
        add_header Access-Control-Allow-Headers 'Origin, X-Requested-With, Content-Type, Accept, X-IC-Token' always;
        add_header Access-Control-Max-Age 86400 always;
    }

    # 处理 OPTIONS 预检请求
    if ($request_method = 'OPTIONS') {
        return 204;
    }

    # 日志配置
    access_log /var/log/nginx/toptu.top.access.log;
    error_log /var/log/nginx/toptu.top.error.log;
}

# HTTPS 服务器（使用 Cloudflare Origin Certificate）
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name toptu.top www.toptu.top;

    # SSL 证书配置（阿里云 SSL 证书）
    ssl_certificate /etc/nginx/ssl/toptu.top/toptu.top.crt;
    ssl_certificate_key /etc/nginx/ssl/toptu.top/toptu.top.key;

    # SSL 安全配置
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers 'ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384';
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 10m;

    # Node.js 反向代理（转发所有请求到 Express 服务器）
    location / {
        proxy_pass http://127.0.0.1:1086;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
        proxy_read_timeout 300s;
        proxy_connect_timeout 75s;
        
        # CORS 头
        add_header Access-Control-Allow-Origin * always;
        add_header Access-Control-Allow-Methods 'GET, POST, OPTIONS' always;
        add_header Access-Control-Allow-Headers 'Origin, X-Requested-With, Content-Type, Accept, X-IC-Token' always;
        add_header Access-Control-Max-Age 86400 always;
    }

    # 处理 OPTIONS 预检请求
    if ($request_method = 'OPTIONS') {
        return 204;
    }

    # 日志配置
    access_log /var/log/nginx/toptu.top.https.access.log;
    error_log /var/log/nginx/toptu.top.https.error.log;
}

