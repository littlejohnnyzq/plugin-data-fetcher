<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" >
    <meta name="format-detection" content="telephone=no">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>插件用户数采集</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 12px;
        }

        h2 {
            margin: 0;
        }

        .page-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 8px;
        }

        .header-actions {
            display: flex;
            align-items: center;
            gap: 14px;
        }

        .logout-form {
            margin: 0;
        }

        .header-link,
        .logout-button {
            padding: 0;
            border: 0;
            background: transparent;
            color: #236de3;
            font-size: 13px;
            font-family: inherit;
            text-decoration: none;
            cursor: pointer;
        }

        .header-link:hover,
        .logout-button:hover {
            text-decoration: underline;
        }

        .container {
            display: flex;
            flex-direction: column;
            border: #ddd 1px solid;
            border-radius: 6px;
            padding: 4px;
        }

        .time-columns {
            background-color: #f2f4f6;
            display: flex;
            flex-direction: column;
            flex-grow: 0;
            width: 100%;
            gap: 2px;
        }

        .time-column {
            flex: 1;
            display: flex;
            flex-direction: row;
            height: 100%;
            border-bottom: #ddd 1px solid;
            overflow-x: scroll;
            margin-top: 4px;
        }

        #data-table {
            background-color: #ffffff;
            border-collapse: collapse;
            margin-top: 4px;
            width: 100%;
            flex: 1;
        }

        #data-table td {
            border: 1px solid #ddd;
            padding: 8px;
            max-height: 26px;
            text-align: left;
            flex: 1;
            font-size: 13px;
            font-weight: 500;
        }

        #data-table th {
            background-color: #f2f2f2;
            font-size: 13px;
            font-weight: 400;
            padding: 6px 8px;
        }

        #data-table td.metric-cell {
            padding: 2px 8px;
            white-space: nowrap;
            vertical-align: middle;
        }

        .metric-value {
            color: #111;
            font-size: 13px;
            font-weight: 500;
            line-height: 15px;
        }

        .metric-delta {
            color: #777;
            font-size: 12px;
            font-weight: 500;
            line-height: 12px;
        }

        .metric-delta.positive {
            color: #d93025;
        }

        .metric-delta.negative {
            color: #188038;
        }

        .metric-delta.user-low {
            color: #555;
        }

        .metric-delta.user-medium {
            color: #d88900;
        }

        .metric-delta.user-high {
            color: #d93025;
        }

        .time-label {
            cursor: pointer;
            color: black;
            text-decoration: none;
            padding: 4px 8px;
            display: block;
            /* border: 1px solid #ddd; */
            text-align: right;
            border-radius: 6px 6px 0 0;
        }

        .time-label:hover {
            background-color: #e0e0e0;
        }

        .active {
            background-color: #236de3;
            color: white;
        }

        .table-area {
            display: flex;
            flex-grow: 1;
            flex-basis: 1;
            flex-direction: column;
            padding: 4px;

        }

        .tool-bar {
            flex-grow: 0;
            height: 32px;
            display: flex;
            flex-direction: row;
            align-items: end;
            justify-content: end;
            padding: 4px 12px;
            gap: 12px;
        }

        .top-bar {
            display: flex;
            flex-direction: row;
            padding: 16px;
            gap: 16px;
        }

        .ellipsis {
            width: 100%;
            height: 26px;
            line-height: 26px;
            /* white-space: nowrap; */
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .trend-panel {
            margin: 4px 0 8px;
            padding: 10px 12px 8px;
            border: 1px solid #ddd;
            border-radius: 6px;
            background: #fff;
        }

        .trend-view-tabs {
            display: flex;
            gap: 16px;
            margin-bottom: 10px;
            border-bottom: 1px solid #e6e8eb;
        }

        .trend-view-tab {
            margin-bottom: -1px;
            padding: 4px 1px 7px;
            border: 0;
            border-bottom: 2px solid transparent;
            background: transparent;
            color: #666;
            font: inherit;
            cursor: pointer;
        }

        .trend-view-tab.active {
            border-bottom-color: #236de3;
            color: #236de3;
            font-weight: 600;
        }

        .trend-toolbar,
        .trend-control-group {
            display: flex;
            align-items: center;
            flex-wrap: wrap;
            gap: 6px;
        }

        .trend-toolbar {
            justify-content: space-between;
            gap: 10px 16px;
            margin-bottom: 4px;
        }

        .trend-control-group button {
            padding: 4px 9px;
            border: 1px solid #d5d5d5;
            border-radius: 5px;
            background: #fff;
            color: #444;
            cursor: pointer;
        }

        .trend-control-group button.active {
            border-color: #236de3;
            background: #236de3;
            color: #fff;
        }

        #trend-day {
            height: 25px;
            box-sizing: border-box;
            border: 1px solid #d5d5d5;
            border-radius: 5px;
        }

        .trend-chart-wrap {
            position: relative;
            width: 100%;
            height: 280px;
        }

        #trend-chart {
            display: block;
            width: 100%;
            height: 100%;
        }

        .trend-tooltip {
            position: absolute;
            z-index: 2;
            display: none;
            min-width: 170px;
            padding: 7px 9px;
            border: 1px solid #d8d8d8;
            border-radius: 5px;
            background: rgba(255, 255, 255, 0.96);
            box-shadow: 0 3px 12px rgba(0, 0, 0, 0.12);
            pointer-events: none;
            font-size: 11px;
            line-height: 17px;
        }

        .trend-legend {
            display: flex;
            flex-wrap: wrap;
            gap: 3px 12px;
            min-height: 20px;
            margin-top: 2px;
        }

        .trend-legend-item {
            max-width: 260px;
            padding: 1px 0;
            border: 0;
            background: transparent;
            cursor: pointer;
            overflow: hidden;
            color: #333;
            font-size: 11px;
            text-overflow: ellipsis;
            white-space: nowrap;
        }

        .trend-legend-item.hidden-series {
            opacity: 0.35;
        }

        .trend-legend-line {
            display: inline-block;
            width: 16px;
            height: 3px;
            margin-right: 5px;
            vertical-align: middle;
            border-radius: 2px;
        }

        #trend-status {
            color: #777;
            font-size: 11px;
        }

        .overview-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 12px;
            margin-bottom: 9px;
            color: #777;
            font-size: 11px;
        }

        .overview-table-wrap {
            width: 100%;
            overflow-x: auto;
            border: 1px solid #e0e3e7;
            border-radius: 6px;
        }

        .overview-table {
            width: 100%;
            min-width: 1120px;
            border-collapse: collapse;
            table-layout: fixed;
        }

        .overview-table th,
        .overview-table td {
            padding: 11px 6px;
            border-right: 1px solid #e5e7ea;
            border-bottom: 1px solid #e5e7ea;
            text-align: center;
            white-space: nowrap;
        }

        .overview-table th:last-child,
        .overview-table td:last-child { border-right: 0; }
        .overview-table tbody tr:last-child th,
        .overview-table tbody tr:last-child td { border-bottom: 0; }
        .overview-table thead th { background: #f2f4f6; color: #555; font-size: 11px; font-weight: 500; }
        .overview-table thead th:first-child,
        .overview-table tbody th { width: 92px; }
        .overview-table tbody th { background: #fafbfc; color: #555; font-size: 11px; font-weight: 500; text-align: left; }
        .overview-table td { color: #555; }
        .overview-primary-value { font-size: 16px; font-weight: 600; line-height: 19px; }
        .overview-primary-value.positive { color: #d93025; }
        .overview-primary-value.negative { color: #188038; }
        .overview-secondary-value { margin-top: 2px; color: #777; font-size: 11px; font-weight: 400; line-height: 14px; }
        .overview-plugin-name { display: block; overflow: hidden; text-overflow: ellipsis; }
        .overview-owned { color: #236de3; }
        .overview-empty { padding: 38px 12px; color: #777; text-align: center; }

        @media (max-width: 600px) {
            .overview-header { align-items: flex-start; flex-direction: column; }
        }
    </style>
</head>

<body>
    <header class="page-header">
        <h2>插件数据采集</h2>
        <div class="header-actions">
            <a class="header-link" href="/product/plugin-data/users/">用户表</a>
            <form class="logout-form" action="/product/plugin-data/logout" method="post">
                <button class="logout-button" type="submit">退出后台</button>
            </form>
        </div>
    </header>
    <!-- <div class="top-bar">
        <label for="interval">自动采集间隔(分钟):</label>
        <input type="number" style="width: 48px;" id="interval" value="30" disabled>
        <button id="start-button">启动</button>
        <button id="stop-button">停止</button>
       
    </div> -->

    <section class="trend-panel">
        <div class="trend-view-tabs" id="trend-view-tabs">
            <button class="trend-view-tab active" type="button" data-view="chart">趋势图</button>
            <button class="trend-view-tab" type="button" data-view="overview">插件概览</button>
        </div>
        <div id="trend-chart-view">
            <div class="trend-toolbar">
                <div class="trend-control-group" id="trend-metric-controls">
                    <button type="button" data-metric="users">用户日增</button>
                    <button type="button" data-metric="likes">点赞日增</button>
                    <button type="button" class="active" data-metric="saves">保存日增</button>
                </div>
                <div class="trend-control-group" id="trend-period-controls">
                    <button type="button" class="active" data-mode="hourly">单日分时</button>
                    <button type="button" data-mode="daily" data-days="30">最近1个月</button>
                    <button type="button" data-mode="daily" data-days="90">最近3个月</button>
                    <input id="trend-day" type="date" aria-label="选择分时数据日期">
                    <span id="trend-status"></span>
                </div>
            </div>
            <div class="trend-chart-wrap">
                <canvas id="trend-chart"></canvas>
                <div id="trend-tooltip" class="trend-tooltip"></div>
            </div>
            <div id="trend-legend" class="trend-legend"></div>
        </div>
        <div id="trend-overview-view" hidden>
            <div class="overview-header">
                <span>近期数据取最新采集点；点赞率、保存率按累计量 ÷ 当前用户数计算</span>
                <span id="overview-status">加载中…</span>
            </div>
            <div id="overview-table-wrap" class="overview-table-wrap"></div>
        </div>
    </section>

    <div class="container">
        <div class="time-columns">
            <div class="time-column" id="years-column" style="display: none;"></div>
            <div class="time-column hidden" id="months-column"></div>
            <div class="time-column hidden" id="days-column"></div>
            <div class="time-column hidden" id="times-column"></div>
        </div>
        <div class="table-area">
            <div id="toolbar" class="tool-bar">
                <p id="dataTime" style="flex-grow: 1; margin: 0;"></p>
                <button id="fetchOnce-button">单次采集</button>
                <button id="deleteBtn">删除本次数据</button>
            </div>
            <table id="data-table">
                <thead>
                    <tr>
                        <th></th>
                        <th>插件名</th>
                        <th>用户数</th>
                        <th>点赞</th>
                        <th>保存</th>
                    </tr>
                </thead>
                <tbody id="data-body">
                </tbody>
            </table>
        </div>

    </div>

    <script src="/product/plugin-data/chart-scale.js"></script>
    <script>

        const HIGHLIGHTED_PLUGIN_IDS = new Set([
            '1370606842652257742',
            '1387823712562916211',
            '1414925802794094447',
            '1473659572195493091'
        ]);
        const PLUGIN_DATA_API = '/api/plugin-data';
        const TREND_COLORS = [
            '#236de3', '#e34a33', '#18a058', '#8b5cf6', '#e59f00',
            '#00a6a6', '#d946ef', '#795548', '#64748b', '#f97316',
            '#0f766e'
        ];
        const trendState = {
            metric: 'saves',
            mode: 'hourly',
            days: 30,
            data: null,
            hiddenContentIds: new Set()
        };
        let overviewLoaded = false;
        let currentSelectedTimeDiv = null;
        document.addEventListener('DOMContentLoaded', () => {
            fetchDirectory();  // 获取目录信息
            initializeTrendChart();
        });

        async function fetchDirectory() {
            try {
                const response = await fetch(`${PLUGIN_DATA_API}/get-directory`);
                const directory = await response.json();
                // console.log('Directory received:', directory);
                displayTimeLabels(directory);
                fetchInitialData(directory);  // 请求初始数据
            } catch (error) {
                console.error('Error fetching directory:', error);
            }
        }

        async function fetchInitialData(directory) {
            const years = Object.keys(directory).sort().reverse();
            const months = Object.keys(directory[years[0]]).sort().reverse();
            const days = Object.keys(directory[years[0]][months[0]]).sort().reverse();
            const times = directory[years[0]][months[0]][days[0]].times.sort().reverse();
            const initialTime = times[0];  // 获取最新时间点
            getData(years[0], months[0], days[0], initialTime);
        }

        document.getElementById('fetchOnce-button').addEventListener('click', event => {
            fetchData(event.currentTarget);
        });

        async function fetchData(button) {
            const originalText = button.textContent;
            button.disabled = true;
            button.textContent = '采集中…';

            try {
                const response = await fetch(`${PLUGIN_DATA_API}/fetch-plugin-data`);
                if (!response.ok) {
                    const result = await response.json().catch(() => ({}));
                    throw new Error(result.error || `采集请求失败（${response.status}）`);
                }

                button.textContent = '采集完成';
                setTimeout(() => location.reload(), 500);
            } catch (error) {
                console.error('Error fetching data:', error);
                button.textContent = '采集失败，重试';
                button.title = error.message;
                button.disabled = false;

                setTimeout(() => {
                    if (!button.disabled) button.textContent = originalText;
                }, 3000);
            }
        }

        function formatLocalDateInput(date) {
            const year = date.getFullYear();
            const month = String(date.getMonth() + 1).padStart(2, '0');
            const day = String(date.getDate()).padStart(2, '0');
            return `${year}-${month}-${day}`;
        }

        function initializeTrendChart() {
            const dayInput = document.getElementById('trend-day');
            dayInput.value = formatLocalDateInput(new Date());

            document.querySelectorAll('#trend-metric-controls button').forEach(button => {
                button.addEventListener('click', () => {
                    trendState.metric = button.dataset.metric;
                    setActiveTrendButton('#trend-metric-controls button', button);
                    loadPluginTrends();
                });
            });

            document.querySelectorAll('#trend-period-controls button').forEach(button => {
                button.addEventListener('click', () => {
                    trendState.mode = button.dataset.mode;
                    trendState.days = Number(button.dataset.days || 30);
                    dayInput.style.display = trendState.mode === 'hourly' ? '' : 'none';
                    setActiveTrendButton('#trend-period-controls button', button);
                    loadPluginTrends();
                });
            });

            dayInput.addEventListener('change', loadPluginTrends);
            document.querySelectorAll('#trend-view-tabs button').forEach(button => {
                button.addEventListener('click', () => switchTrendView(button.dataset.view, button));
            });
            document.getElementById('trend-chart').addEventListener('mousemove', showTrendTooltip);
            document.getElementById('trend-chart').addEventListener('mouseleave', hideTrendTooltip);
            window.addEventListener('resize', () => drawTrendChart(trendState.data));
            loadPluginTrends();
        }

        function switchTrendView(view, activeButton) {
            setActiveTrendButton('#trend-view-tabs button', activeButton);
            const showOverview = view === 'overview';
            document.getElementById('trend-chart-view').hidden = showOverview;
            document.getElementById('trend-overview-view').hidden = !showOverview;
            hideTrendTooltip();
            if (showOverview && !overviewLoaded) loadPluginOverview();
            if (!showOverview) drawTrendChart(trendState.data);
        }

        async function loadPluginOverview() {
            const status = document.getElementById('overview-status');
            status.textContent = '加载中…';
            try {
                const response = await fetch(`${PLUGIN_DATA_API}/plugin-overview`);
                if (!response.ok) throw new Error(`概览数据请求失败（${response.status}）`);
                const overview = await response.json();
                renderPluginOverview(overview.plugins);
                status.textContent = overview.capturedAt ? `采集于 ${overview.capturedAt}` : '暂无数据';
                overviewLoaded = true;
            } catch (error) {
                console.error('Error loading plugin overview:', error);
                renderPluginOverview([]);
                status.textContent = '加载失败';
            }
        }

        function renderPluginOverview(plugins) {
            const wrapper = document.getElementById('overview-table-wrap');
            wrapper.innerHTML = '';
            if (!plugins.length) {
                const empty = document.createElement('div');
                empty.className = 'overview-empty';
                empty.textContent = '暂无可用的插件概览数据';
                wrapper.appendChild(empty);
                return;
            }

            const table = document.createElement('table');
            table.className = 'overview-table';
            const head = document.createElement('thead');
            const headerRow = document.createElement('tr');
            const metricHeader = document.createElement('th');
            metricHeader.textContent = '指标';
            headerRow.appendChild(metricHeader);
            plugins.forEach(plugin => {
                const header = document.createElement('th');
                const name = document.createElement('span');
                name.className = `overview-plugin-name${plugin.owned ? ' overview-owned' : ''}`;
                name.textContent = abbreviatePluginName(plugin.name, 10);
                name.title = `${plugin.name}${plugin.owned ? '（自有插件）' : ''}`;
                header.appendChild(name);
                headerRow.appendChild(header);
            });
            head.appendChild(headerRow);
            table.appendChild(head);

            const rows = [
                { label: '用户日增', delta: plugin => plugin.userDelta },
                { label: '点赞', delta: plugin => plugin.likeDelta, rate: plugin => plugin.likeRate },
                { label: '保存', delta: plugin => plugin.saveDelta, rate: plugin => plugin.saveRate }
            ];
            const body = document.createElement('tbody');
            rows.forEach(rowDefinition => {
                const row = document.createElement('tr');
                const label = document.createElement('th');
                label.scope = 'row';
                label.textContent = rowDefinition.label;
                row.appendChild(label);
                plugins.forEach(plugin => {
                    const cell = document.createElement('td');
                    const delta = rowDefinition.delta(plugin);
                    const primaryValue = document.createElement('div');
                    primaryValue.className = 'overview-primary-value';
                    primaryValue.textContent = formatSignedTrendValue(delta);
                    if (delta > 0) primaryValue.classList.add('positive');
                    if (delta < 0) primaryValue.classList.add('negative');
                    cell.appendChild(primaryValue);
                    if (rowDefinition.rate) {
                        const secondaryValue = document.createElement('div');
                        secondaryValue.className = 'overview-secondary-value';
                        secondaryValue.textContent = `率 ${formatRate(rowDefinition.rate(plugin))}`;
                        cell.appendChild(secondaryValue);
                    }
                    if (rowDefinition.label === '保存') {
                        cell.title = plugin.saveCollectedAt
                            ? `保存数更新：${formatOverviewDate(plugin.saveCollectedAt)}`
                            : '保存数尚未成功采集';
                    }
                    row.appendChild(cell);
                });
                body.appendChild(row);
            });
            table.appendChild(body);
            wrapper.appendChild(table);
        }

        function formatRate(rate) {
            return Number.isFinite(rate) ? `${(rate * 100).toFixed(2)}%` : '—';
        }

        function formatOverviewDate(value) {
            const date = new Date(value);
            return Number.isNaN(date.getTime()) ? '—' : date.toLocaleString('zh-CN', {
                month: '2-digit', day: '2-digit', hour: '2-digit', minute: '2-digit', hour12: false
            });
        }

        function setActiveTrendButton(selector, activeButton) {
            document.querySelectorAll(selector).forEach(button => button.classList.remove('active'));
            activeButton.classList.add('active');
        }

        async function loadPluginTrends() {
            const status = document.getElementById('trend-status');
            const dayInput = document.getElementById('trend-day');
            const params = new URLSearchParams({
                metric: trendState.metric,
                mode: trendState.mode
            });
            if (trendState.mode === 'hourly') params.set('day', dayInput.value);
            else params.set('days', String(trendState.days));

            status.textContent = '加载中…';
            try {
                const response = await fetch(`${PLUGIN_DATA_API}/plugin-trends?${params}`);
                if (!response.ok) throw new Error(`趋势数据请求失败（${response.status}）`);
                trendState.data = await response.json();
                status.textContent = trendState.data.labels.length > 0
                    ? `${trendState.data.labels.length} 个时间点`
                    : '暂无数据';
                renderTrendLegend(trendState.data.series);
                drawTrendChart(trendState.data);
            } catch (error) {
                console.error('Error loading plugin trends:', error);
                status.textContent = '加载失败';
                trendState.data = null;
                renderTrendLegend([]);
                drawTrendChart(null, error.message);
            }
        }

        function renderTrendLegend(series) {
            const legend = document.getElementById('trend-legend');
            legend.innerHTML = '';
            series.forEach((item, index) => {
                const button = document.createElement('button');
                button.type = 'button';
                button.className = 'trend-legend-item';
                if (trendState.hiddenContentIds.has(item.contentId)) {
                    button.classList.add('hidden-series');
                }
                button.title = item.name;

                const line = document.createElement('span');
                line.className = 'trend-legend-line';
                line.style.backgroundColor = TREND_COLORS[index % TREND_COLORS.length];
                button.appendChild(line);
                button.appendChild(document.createTextNode(abbreviateTrendPluginName(item.name)));
                button.addEventListener('click', () => {
                    if (trendState.hiddenContentIds.has(item.contentId)) {
                        trendState.hiddenContentIds.delete(item.contentId);
                    } else {
                        trendState.hiddenContentIds.add(item.contentId);
                    }
                    renderTrendLegend(series);
                    drawTrendChart(trendState.data);
                });
                legend.appendChild(button);
            });
        }

        function getVisibleTrendSeries(data) {
            return (data?.series ?? [])
                .map((series, index) => ({ ...series, color: TREND_COLORS[index % TREND_COLORS.length] }))
                .filter(series => !trendState.hiddenContentIds.has(series.contentId));
        }

        function drawTrendChart(data, message = '') {
            const canvas = document.getElementById('trend-chart');
            const ctx = canvas.getContext('2d');
            const dpr = window.devicePixelRatio || 1;
            const width = canvas.clientWidth || 900;
            const height = canvas.clientHeight || 280;
            canvas.width = Math.floor(width * dpr);
            canvas.height = Math.floor(height * dpr);
            ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
            ctx.clearRect(0, 0, width, height);

            const labels = data?.labels ?? [];
            const visibleSeries = getVisibleTrendSeries(data);
            const values = visibleSeries.flatMap(series => series.values).filter(Number.isFinite);
            const pad = { top: 12, right: 16, bottom: 30, left: 62 };
            const plotWidth = width - pad.left - pad.right;
            const plotHeight = height - pad.top - pad.bottom;

            ctx.fillStyle = '#fff';
            ctx.fillRect(0, 0, width, height);
            if (labels.length === 0 || values.length === 0) {
                ctx.fillStyle = '#888';
                ctx.font = '13px Arial';
                ctx.textAlign = 'center';
                ctx.fillText(message || '当前范围暂无可用数据', width / 2, height / 2);
                return;
            }

            const { minimum, maximum, step, ticks } = ChartScale.createYAxisScale(values);
            const yAt = value => pad.top + ((maximum - value) / (maximum - minimum)) * plotHeight;

            ctx.font = '11px Arial';
            for (const value of ticks) {
                const y = yAt(value);
                ctx.strokeStyle = '#edf0f3';
                ctx.lineWidth = 1;
                ctx.beginPath();
                ctx.moveTo(pad.left, y);
                ctx.lineTo(width - pad.right, y);
                ctx.stroke();
                ctx.fillStyle = '#777';
                ctx.textAlign = 'right';
                ctx.textBaseline = 'middle';
                ctx.fillText(ChartScale.formatAxisTick(value, step), pad.left - 7, y);
            }

            const xAt = index => labels.length === 1
                ? pad.left + plotWidth / 2
                : pad.left + (plotWidth * index) / (labels.length - 1);
            visibleSeries.forEach(series => {
                ctx.strokeStyle = series.color;
                ctx.lineWidth = 1.7;
                ctx.beginPath();
                let drawing = false;
                series.values.forEach((value, index) => {
                    if (!Number.isFinite(value)) {
                        drawing = false;
                        return;
                    }
                    const x = xAt(index);
                    const y = yAt(value);
                    if (drawing) ctx.lineTo(x, y);
                    else ctx.moveTo(x, y);
                    drawing = true;
                });
                ctx.stroke();
            });

            const labelStep = Math.max(1, Math.ceil(labels.length / 8));
            ctx.fillStyle = '#666';
            ctx.textAlign = 'center';
            ctx.textBaseline = 'top';
            labels.forEach((label, index) => {
                if (index % labelStep !== 0 && index !== labels.length - 1) return;
                const displayLabel = trendState.mode === 'daily' ? label.slice(5) : label;
                ctx.fillText(displayLabel, xAt(index), height - pad.bottom + 8);
            });
        }

        function showTrendTooltip(event) {
            const data = trendState.data;
            if (!data?.labels?.length) return;
            const canvas = event.currentTarget;
            const rect = canvas.getBoundingClientRect();
            const plotLeft = 62;
            const plotRight = 16;
            const plotWidth = rect.width - plotLeft - plotRight;
            const relativeX = Math.max(0, Math.min(plotWidth, event.clientX - rect.left - plotLeft));
            const index = data.labels.length === 1
                ? 0
                : Math.round((relativeX / plotWidth) * (data.labels.length - 1));
            const visibleSeries = getVisibleTrendSeries(data);
            const tooltip = document.getElementById('trend-tooltip');
            const rows = visibleSeries
                .map(series => ({ ...series, value: series.values[index] }))
                .filter(series => Number.isFinite(series.value));
            if (rows.length === 0) return hideTrendTooltip();

            tooltip.innerHTML = '';
            const title = document.createElement('strong');
            title.textContent = data.labels[index];
            tooltip.appendChild(title);
            rows.forEach(series => {
                const row = document.createElement('div');
                const marker = document.createElement('span');
                marker.className = 'trend-legend-line';
                marker.style.backgroundColor = series.color;
                row.appendChild(marker);
                const dailyGrowth = formatSignedTrendValue(series.value);
                let valueText = `${abbreviateTrendPluginName(series.name)}: 日增 ${dailyGrowth}`;
                if (trendState.mode === 'hourly') {
                    const previousValue = index > 0 ? series.values[index - 1] : null;
                    const intervalGrowth = Number.isFinite(previousValue)
                        ? formatSignedTrendValue(series.value - previousValue)
                        : '—';
                    valueText += ` · 较上次 ${intervalGrowth}`;
                }
                row.appendChild(document.createTextNode(valueText));
                tooltip.appendChild(row);
            });

            tooltip.style.display = 'block';
            const left = Math.min(rect.width - tooltip.offsetWidth - 4, event.clientX - rect.left + 12);
            const top = Math.max(4, event.clientY - rect.top - tooltip.offsetHeight - 8);
            tooltip.style.left = `${Math.max(4, left)}px`;
            tooltip.style.top = `${top}px`;
        }

        function hideTrendTooltip() {
            document.getElementById('trend-tooltip').style.display = 'none';
        }

        function formatSignedTrendValue(value) {
            if (!Number.isFinite(value)) return '—';
            if (value > 0) return `+${value.toLocaleString('zh-CN')}`;
            if (value < 0) return value.toLocaleString('zh-CN');
            return '±0';
        }

        function abbreviateTrendPluginName(name) {
            return abbreviatePluginName(name, 15);
        }

        function abbreviatePluginName(name, maximumLength) {
            const characters = Array.from(String(name || ''));
            return characters.length > maximumLength
                ? `${characters.slice(0, maximumLength).join('')}…`
                : characters.join('');
        }

        async function getData(year, month, day, time) {
            try {
                const response = await fetch(`${PLUGIN_DATA_API}/get-data?year=${year}&month=${month}&day=${day}&time=${time}`);
                const data = await response.json();
                // console.log('Data received for ', year, month, day, time, ':', data);
                displayData(data);  // 展示数据
            } catch (error) {
                console.error('Error fetching data:', error);
            }
        }

        function displayTimeLabels(directory) {
            const yearsColumn = document.getElementById('years-column');
            yearsColumn.innerHTML = '';
            let firstYearDiv = null;
            Object.keys(directory).sort((a, b) => b - a).forEach(year => {
                const yearDiv = document.createElement('div');
                yearDiv.textContent = year;
                yearDiv.classList.add('time-label');
                yearDiv.addEventListener('click', () => {
                    document.querySelectorAll('.time-label').forEach(el => el.classList.remove('active'));
                    showMonths(year, directory[year]);
                    yearDiv.classList.add('active');
                });
                yearsColumn.appendChild(yearDiv);
                if (!firstYearDiv) firstYearDiv = yearDiv;
            });

            // 自动选中并显示第一个年份的数据
            if (firstYearDiv) firstYearDiv.click();
        }
        // 展示月份
        function showMonths(year, months) {
            const monthsColumn = document.getElementById('months-column');
            const daysColumn = document.getElementById('days-column');
            const timesColumn = document.getElementById('times-column');
            monthsColumn.innerHTML = '';
            daysColumn.innerHTML = '';
            timesColumn.innerHTML = '';
            monthsColumn.classList.remove('hidden');
            daysColumn.classList.add('hidden');
            timesColumn.classList.add('hidden');

            let firstMonthDiv = null;
            Object.keys(months).sort((a, b) => b - a).forEach(month => {
                const monthDiv = document.createElement('div');
                monthDiv.textContent = `${month}月`;
                monthDiv.classList.add('time-label');
                monthDiv.addEventListener('click', () => {
                    showDays(year, month, months[month]);
                    document.querySelectorAll('#months-column .time-label').forEach(el => el.classList.remove('active'));
                    monthDiv.classList.add('active');
                });

                monthsColumn.appendChild(monthDiv);
                if (!firstMonthDiv) firstMonthDiv = monthDiv;
            });

            // 自动触发第一个月份的点击，显示日
            if (firstMonthDiv) {
                firstMonthDiv.click();
            }
        }

        // 展示日期
        function showDays(year, month, days) {
            const daysColumn = document.getElementById('days-column');
            const timesColumn = document.getElementById('times-column');
            daysColumn.innerHTML = '';
            timesColumn.innerHTML = '';
            daysColumn.classList.remove('hidden');
            timesColumn.classList.add('hidden');

            let firstDayDiv = null;
            Object.keys(days).sort((a, b) => b - a).forEach(day => {
                const dayDiv = document.createElement('div');
                dayDiv.textContent = `${day}日`;
                dayDiv.classList.add('time-label');
                dayDiv.addEventListener('click', () => {
                    showTimes(year, month, day, days[day].times);
                    document.querySelectorAll('#days-column .time-label').forEach(el => el.classList.remove('active'));
                    dayDiv.classList.add('active');
                });

                daysColumn.appendChild(dayDiv);
                if (!firstDayDiv) firstDayDiv = dayDiv;
            });

            // 自动触发第一个日期的点击，显示时间
            if (firstDayDiv) {
                firstDayDiv.click();
            }
        }

        // 展示时间
        function showTimes(year, month, day, times) {
            // console.log('收到的时间点', times);
            if (!Array.isArray(times)) {
                console.error('times is not an array:', times);
                return; // 如果不是数组则退出
            }

            const timesColumn = document.getElementById('times-column');
            timesColumn.innerHTML = '';
            timesColumn.classList.remove('hidden');
            const dataTimeText = document.getElementById('dataTime');
            times.sort((a, b) => b.localeCompare(a)).forEach(time => {
                const timeDiv = document.createElement('div');
                const deleteBtn = document.getElementById('deleteBtn');
                const timeText = time.replace('-', ':');
                timeDiv.textContent = timeText;
                timeDiv.classList.add('time-label');
                timeDiv.addEventListener('click', () => {
                    document.querySelectorAll('#times-column .time-label').forEach(el => el.classList.remove('active'));
                    timeDiv.classList.add('active');
                    getData(year, month, day, time);
                    currentSelectedTimeDiv = timeDiv; // 设置当前选中的时间Div
                    deleteBtn.onclick = () => deleteCurrentEntry(year, month, day, time);
                    dataTimeText.textContent = `${month}/${day} ${timeText}`;
                });

                timesColumn.appendChild(timeDiv);
            });

            // 默认显示第一个时间点的数据
            if (times.length > 0) {
                const timeText = times[0].replace('-', ':');
                const firstTimeDiv = timesColumn.querySelector('.time-label');
                firstTimeDiv.classList.add('active');
                getData(year, month, day, times[0]);
                currentSelectedTimeDiv = firstTimeDiv; // 设置当前选中的时间Div
                deleteBtn.onclick = () => deleteCurrentEntry(year, month, day, times[0]);
                dataTimeText.textContent = `${month}/${day} ${timeText}`;
            }
        }

        function displayData(entries) {
            // console.log(entries)
            const dataBody = document.getElementById('data-body');
            dataBody.innerHTML = '';
            // console.log('接受到的数据：', entries);

            entries.forEach((entry, index) => {
                const row = document.createElement('tr');

                const indexCell = document.createElement('td');
                indexCell.textContent = index + 1;
                row.appendChild(indexCell);

                const nameCell = document.createElement('td');
                row.appendChild(nameCell);
                const nameSpan = document.createElement('div');
                nameSpan.textContent = entry.name;
                nameSpan.classList.add('ellipsis');
                nameCell.appendChild(nameSpan)

                row.appendChild(createMetricCell(entry.users, entry.DoDCount, 'users'));
                row.appendChild(createMetricCell(entry.likes, entry.DoDLikes, 'likes'));
                row.appendChild(createMetricCell(entry.saves, entry.DoDSaves, 'saves'));

                dataBody.appendChild(row);
                if (HIGHLIGHTED_PLUGIN_IDS.has(String(entry.contentId))) {
                    row.style.backgroundColor = '#eee8ff';
                }

            });
        }

        function createMetricCell(value, delta, metric) {
            const cell = document.createElement('td');
            cell.classList.add('metric-cell');

            const valueElement = document.createElement('div');
            valueElement.classList.add('metric-value');
            valueElement.textContent = formatMetricNumber(value);
            cell.appendChild(valueElement);

            const deltaElement = document.createElement('div');
            deltaElement.classList.add('metric-delta');
            const numericDelta = parseMetricNumber(delta);

            if (numericDelta === null) {
                deltaElement.textContent = '—';
            } else if (numericDelta > 0) {
                deltaElement.textContent = `+${numericDelta.toLocaleString('zh-CN')}`;
            } else if (numericDelta < 0) {
                deltaElement.textContent = numericDelta.toLocaleString('zh-CN');
            } else {
                deltaElement.textContent = '±0';
            }

            if (numericDelta !== null && metric === 'users') {
                if (numericDelta < 50) deltaElement.classList.add('user-low');
                else if (numericDelta < 100) deltaElement.classList.add('user-medium');
                else deltaElement.classList.add('user-high');
            } else if (numericDelta > 0) {
                deltaElement.classList.add('positive');
            } else if (numericDelta < 0) {
                deltaElement.classList.add('negative');
            }

            cell.appendChild(deltaElement);
            return cell;
        }

        function formatMetricNumber(value) {
            const numericValue = parseMetricNumber(value);
            return numericValue === null ? '—' : numericValue.toLocaleString('zh-CN');
        }

        function parseMetricNumber(value) {
            if (value === null || value === undefined || value === '' || value === '—' || value === '--') {
                return null;
            }

            const numericValue = Number(String(value).replace(/,/g, ''));
            return Number.isFinite(numericValue) ? numericValue : null;
        }

        function deleteCurrentEntry(year, month, day, time) {
            if (!confirm('确定删除这组采集数据?')) {
                return; // 用户取消操作
            }
            removeData(year, month, day, time, () => {
                const nextTimeDiv = currentSelectedTimeDiv.nextElementSibling || currentSelectedTimeDiv.previousElementSibling;
                currentSelectedTimeDiv.parentNode.removeChild(currentSelectedTimeDiv);
                if (nextTimeDiv) {
                    nextTimeDiv.click(); // 触发下一个标签的点击事件，显示数据
                }
                // console.log(nextTimeDiv);
                currentSelectedTimeDiv = null; // 清除引用
            });
        }

        function removeData(year, month, day, time, callback) {
            // console.log(year, month, day, time);
            fetch(`${PLUGIN_DATA_API}/delete-time-data?year=${year}&month=${month}&day=${day}&time=${time}`, {
                method: 'DELETE'
            })
                .then(response => response.json())
                .then(data => {
                    if (data.success) {
                        callback();
                    } else {
                        alert('Failed to delete data');
                    }
                })
                .catch(error => {
                    console.error('Error deleting time data:', error);
                    alert('Error deleting data');
                });
        }
    </script>
